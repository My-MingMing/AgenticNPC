# NPC任务求解配置（Stage 2）
logging:
  solution_dir: "game_adaptation/npc_dialogue/data/solutions"

step_models:
  SolveAgent:
    model_name: "Qwen3-235B"
    temperature: 0.7
    max_tokens: 512
    enable_thinking: false
    thinking_budget: 256
    final_answer_max_tokens: 128
  MockToolAgent:
    model_name: "Qwen3-235B"
    temperature: 0.2
    max_tokens: 1024
  MockUserAgent:
    model_name: "Qwen3-235B"
    temperature: 0.7
    max_tokens: 512

api_configs:
  default:
    api_base: "QWEN_API_BASE"
    api_key_env: "QWEN_API_KEY"
  Qwen3-235B:
    api_base: "QWEN_API_BASE"
    api_key_env: "QWEN_API_KEY"

max_workers: 2
max_turns: 10

thinking_router:
  enabled: true
  budget_tokens: 256
  final_answer_max_tokens: 128
